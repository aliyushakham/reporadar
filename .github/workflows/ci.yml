name: Tests and reproducibility
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/evaluate.py
      - run: git diff --exit-code -- benchmarks/results.json
      - run: python scripts/validate_workflow.py
      - run: reporadar --db /tmp/radar.sqlite scan examples/shop
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reporadar:test .
      - run: |
          docker run -d --name radar -p 127.0.0.1:8765:8765 reporadar:test
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8765/api/health; then exit 0; fi
            sleep 1
          done
          docker logs radar
          exit 1
      - run: |
          curl --fail -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/scan
