services:
  reporadar:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - radar-data:/data
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.0.0
    profiles: [automation]
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      reporadar:
        condition: service_healthy
volumes:
  radar-data:
  n8n-data:
