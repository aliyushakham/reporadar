[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reporadar"
version = "0.1.0"
description = "Evidence-first Python repository exploration: AST, retrieval, change impact and documentation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aliia Khamatkhanova"}]
dependencies = []

[project.scripts]
reporadar = "reporadar.cli:main"

[tool.setuptools.packages.find]
include = ["reporadar*"]

[tool.setuptools.package-data]
reporadar = ["static/*", "schema.sql"]
